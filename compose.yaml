services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      MODEL_PATH: artefacts/bank_marketing_model_catboost_bundle.joblib
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bank_marketing
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_marketing
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: